<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- CRT Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="crtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f190e" />
      <stop offset="100%" stop-color="#070a06" />
    </linearGradient>
  </defs>

  <!-- CRT Monitor Bezel & Screen -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="url(#crtGrad)" stroke="#33ff66" stroke-width="2.5" />
  
  <!-- Subtle Inner Scanlines Grid -->
  <line x1="6" y1="16" x2="58" y2="16" stroke="#1c331a" stroke-width="1" />
  <line x1="6" y1="28" x2="58" y2="28" stroke="#1c331a" stroke-width="1" />
  <line x1="6" y1="40" x2="58" y2="40" stroke="#1c331a" stroke-width="1" />
  <line x1="6" y1="52" x2="58" y2="52" stroke="#1c331a" stroke-width="1" />

  <!-- Terminal Top Dots / Status Lights -->
  <circle cx="10" cy="10" r="1.5" fill="#33ff66" opacity="0.8" />
  <circle cx="15" cy="10" r="1.5" fill="#ffb000" opacity="0.8" />
  <circle cx="20" cy="10" r="1.5" fill="#ff3b3b" opacity="0.8" />

  <!-- Glowing Terminal Prompt Character ">" -->
  <path d="M 14 24 L 28 35 L 14 46" fill="none" stroke="#33ff66" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)" />

  <!-- Glowing Terminal Blinking Cursor "_" -->
  <rect x="34" y="41" width="16" height="5" fill="#33ff66" filter="url(#glow)" />
</svg>
